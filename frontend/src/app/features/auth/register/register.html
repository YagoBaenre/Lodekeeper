<div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--p-primary-color) 10%, transparent 30%)">
  <div class="w-full pt-10 pb-20 px-8 sm:px-20" style="border-radius: 53px; background: var(--p-content-background)">

    <div class="text-center mb-8">
      <i class="pi pi-shield mb-4 block" style="font-size: 3.5rem; color: var(--p-primary-color)"></i>
      <h1 class="text-4xl font-medium mb-2">Lodekeeper</h1>
      <span class="text-surface-400 font-medium">Create your account</span>
    </div>

    @if (error()) {
      <p-message severity="error" class="block mb-5 w-full">{{ error() }}</p-message>
    }

    <div>
      <label class="block text-xl font-medium mb-2">Email</label>
      <input pInputText type="email" [(ngModel)]="email" name="email" placeholder="your@email.com" class="w-full mb-8" required />
      <label class="block text-xl font-medium mb-2">Password</label>
      <p-password [(ngModel)]="password" name="password" [toggleMask]="true" [fluid]="true" placeholder="Your password" required />
      <label class="block text-xl font-medium mb-2 mt-4">Confirm Password</label>
      <p-password [(ngModel)]="confirmPassword" name="confirmPassword" [feedback]="false" [toggleMask]="true" [fluid]="true" placeholder="Repeat password" required />
      <p-button (onClick)="onSubmit()" label="Register" icon="pi pi-user-plus" styleClass="w-full mt-6" [loading]="loading()" />
    </div>

    <p class="text-center text-surface-400 text-sm mt-6">
      Already have an account?
      <a routerLink="/auth/login" class="font-medium no-underline ml-1" style="color: var(--p-primary-color)">Sign in</a>
    </p>
  </div>
</div>
